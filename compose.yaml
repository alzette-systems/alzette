name: alzette-poc

services:
  casdoor:
    image: casbin/casdoor-all-in-one@sha256:83954bb426823170cde6cbcc1eccabd4dd15432c3534c3c8b73326c0a45af78b
    environment:
      RUNNING_IN_DOCKER: "true"
      httpport: 19084
      driverName: sqlite
      dataSourceName: file:/data/casdoor.db?cache=shared
      dbName: casdoor
      origin: ${ALZETTE_WORKFORCE_OIDC_ISSUER:-http://casdoor.localhost:19084}
      runmode: prod
    volumes:
      - alzette-casdoor:/data
      - ./deploy/casdoor/app.conf:/conf/app.conf:ro
    ports:
      - "127.0.0.1:${ALZETTE_CASDOOR_PORT:-19084}:19084"
    networks:
      default:
        aliases:
          - casdoor.localhost
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/19084"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  casdoor-bootstrap:
    image: alzette-poc:local
    build:
      context: .
    command: ["identity", "bootstrap-casdoor"]
    environment:
      ALZETTE_CASDOOR_BOOTSTRAP_ENDPOINT: http://casdoor:19084
      ALZETTE_CASDOOR_ADMIN_PASSWORD: ${ALZETTE_CASDOOR_ADMIN_PASSWORD:-123}
      ALZETTE_WORKFORCE_OIDC_CLIENT_ID: ${ALZETTE_WORKFORCE_OIDC_CLIENT_ID:-alzette-local-workforce}
      ALZETTE_WORKFORCE_OIDC_CLIENT_SECRET: ${ALZETTE_WORKFORCE_OIDC_CLIENT_SECRET:-local-workforce-client-secret-change-before-remote-use}
      ALZETTE_WORKFORCE_OIDC_REDIRECT_URL: ${ALZETTE_WORKFORCE_OIDC_REDIRECT_URL:-http://127.0.0.1:8081/login/oidc/callback}
      ALZETTE_WORKFORCE_AGENT_OIDC_REDIRECT_URL: ${ALZETTE_WORKFORCE_AGENT_OIDC_REDIRECT_URL:-http://127.0.0.1:43127/callback}
      ALZETTE_ALLOW_INSECURE_WORKFORCE_OIDC: ${ALZETTE_ALLOW_INSECURE_WORKFORCE_OIDC:-true}
      ALZETTE_CASDOOR_DEMO_USERNAME: ${ALZETTE_CASDOOR_DEMO_USERNAME:-employee}
      ALZETTE_CASDOOR_DEMO_PASSWORD: ${ALZETTE_CASDOOR_DEMO_PASSWORD:-employee-demo-password}
      ALZETTE_CASDOOR_DEMO_EMAIL: ${ALZETTE_CASDOOR_DEMO_EMAIL:-employee@example.test}
    depends_on:
      casdoor:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alzette}
      POSTGRES_USER: ${POSTGRES_USER:-alzette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - alzette-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: alzette-poc:local
    build:
      context: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alzette}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-alzette}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: alzette-poc:local
    command: ["gateway", "--addr", ":8080"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alzette}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-alzette}?sslmode=disable
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      ALZETTE_PROVIDER_SECRET_REFS: ${ALZETTE_PROVIDER_SECRET_REFS:-OPENROUTER_API_KEY,DEEPSEEK_API_KEY}
      ALZETTE_ALLOW_INSECURE_TARGETS: ${ALZETTE_ALLOW_INSECURE_TARGETS:-false}
    secrets:
      - openrouter_api_key
      - deepseek_api_key
    ports:
      - "${ALZETTE_HTTP_BIND_ADDRESS:-127.0.0.1}:${ALZETTE_GATEWAY_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/alzette", "healthcheck", "--url", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  control:
    image: alzette-poc:local
    command: ["control", "--addr", ":8081", "--static-dir", "/app/portal"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alzette}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-alzette}?sslmode=disable
      ALZETTE_PUBLIC_GATEWAY_URL: ${ALZETTE_PUBLIC_GATEWAY_URL:-http://127.0.0.1:8080}
      ALZETTE_PUBLIC_CONTROL_URL: ${ALZETTE_PUBLIC_CONTROL_URL:-http://127.0.0.1:8081}
      ALZETTE_ALLOW_INSECURE_PUBLIC_GATEWAY: ${ALZETTE_ALLOW_INSECURE_PUBLIC_GATEWAY:-true}
      ALZETTE_PORTAL_COOKIE_SECURE: ${ALZETTE_PORTAL_COOKIE_SECURE:-false}
      ALZETTE_PORTAL_SESSION_TTL: ${ALZETTE_PORTAL_SESSION_TTL:-12h}
      ALZETTE_WORKFORCE_OIDC_ISSUER: ${ALZETTE_WORKFORCE_OIDC_ISSUER:-http://casdoor.localhost:19084}
      ALZETTE_WORKFORCE_OIDC_CLIENT_ID: ${ALZETTE_WORKFORCE_OIDC_CLIENT_ID:-alzette-local-workforce}
      ALZETTE_WORKFORCE_OIDC_CLIENT_SECRET: ${ALZETTE_WORKFORCE_OIDC_CLIENT_SECRET:-local-workforce-client-secret-change-before-remote-use}
      ALZETTE_WORKFORCE_OIDC_REDIRECT_URL: ${ALZETTE_WORKFORCE_OIDC_REDIRECT_URL:-http://127.0.0.1:8081/login/oidc/callback}
      ALZETTE_WORKFORCE_OIDC_SIGNUP_URL: ${ALZETTE_WORKFORCE_OIDC_SIGNUP_URL:-http://casdoor.localhost:19084/signup/oauth/authorize}
      ALZETTE_WORKFORCE_AGENT_OIDC_REDIRECT_URL: ${ALZETTE_WORKFORCE_AGENT_OIDC_REDIRECT_URL:-http://127.0.0.1:43127/callback}
      ALZETTE_ALLOW_INSECURE_WORKFORCE_OIDC: ${ALZETTE_ALLOW_INSECURE_WORKFORCE_OIDC:-true}
      ALZETTE_BILLING_PROVIDER: ${ALZETTE_BILLING_PROVIDER:-disabled}
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      ALZETTE_BILLING_SUCCESS_URL: ${ALZETTE_BILLING_SUCCESS_URL:-}
      ALZETTE_BILLING_CANCEL_URL: ${ALZETTE_BILLING_CANCEL_URL:-}
      ALZETTE_BILLING_RETURN_URL: ${ALZETTE_BILLING_RETURN_URL:-}
    secrets:
      - stripe_secret_key
    ports:
      - "${ALZETTE_HTTP_BIND_ADDRESS:-127.0.0.1}:${ALZETTE_CONTROL_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      casdoor-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/alzette", "healthcheck", "--url", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  billing-webhook:
    image: alzette-poc:local
    command: ["billing-webhook", "--addr", ":8083"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alzette}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-alzette}?sslmode=disable
      ALZETTE_BILLING_PROVIDER: ${ALZETTE_BILLING_PROVIDER:-disabled}
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      ALZETTE_STRIPE_ALLOW_LIVE_MODE: ${ALZETTE_STRIPE_ALLOW_LIVE_MODE:-false}
    secrets:
      - stripe_webhook_secret
    ports:
      - "${ALZETTE_BILLING_WEBHOOK_BIND_ADDRESS:-127.0.0.1}:${ALZETTE_BILLING_WEBHOOK_PORT:-8083}:8083"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/alzette", "healthcheck", "--url", "http://127.0.0.1:8083/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  public:
    image: alzette-poc:local
    command: ["public", "--addr", ":8082", "--static-dir", "/app/public"]
    environment:
      ALZETTE_PUBLIC_PORTAL_URL: ${ALZETTE_PUBLIC_PORTAL_URL:-http://127.0.0.1:8081/login}
    ports:
      - "${ALZETTE_HTTP_BIND_ADDRESS:-127.0.0.1}:${ALZETTE_PUBLIC_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "/usr/local/bin/alzette", "healthcheck", "--url", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  worker:
    image: alzette-poc:local
    command: ["worker", "--rollup-interval", "${ALZETTE_ROLLUP_INTERVAL:-1m}", "--rollup-lookback", "${ALZETTE_ROLLUP_LOOKBACK:-48h}"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alzette}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-alzette}?sslmode=disable
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      ALZETTE_PROVIDER_SECRET_REFS: ${ALZETTE_PROVIDER_SECRET_REFS:-OPENROUTER_API_KEY,DEEPSEEK_API_KEY}
      ALZETTE_ALLOW_INSECURE_TARGETS: ${ALZETTE_ALLOW_INSECURE_TARGETS:-false}
      ALZETTE_ENABLE_TARGET_PROBES: ${ALZETTE_ENABLE_TARGET_PROBES:-false}
    secrets:
      - openrouter_api_key
      - deepseek_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/alzette", "worker-health", "--maximum-age", "${ALZETTE_WORKER_HEALTH_MAXIMUM_AGE:-5m}"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  alzette-postgres:
  alzette-casdoor:

secrets:
  openrouter_api_key:
    file: ${OPENROUTER_API_KEY_SECRET_FILE:-/dev/null}
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_SECRET_FILE:-/dev/null}
  stripe_secret_key:
    file: ${STRIPE_SECRET_KEY_SECRET_FILE:-/dev/null}
  stripe_webhook_secret:
    file: ${STRIPE_WEBHOOK_SECRET_SECRET_FILE:-/dev/null}
